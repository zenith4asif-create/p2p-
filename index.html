<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ShareFlow - Fast &amp; Private Universal File Transfer</title>
    <meta name="description" content="Share anything anywhere. Fast, private and temporary file sharing using QR codes, short codes, and direct browser-to-browser P2P transfer with 10-minute auto-expiry." />
    
    <meta property="og:title" content="ShareFlow - Fast &amp; Private Universal File Transfer" />
    <meta property="og:description" content="Share anything anywhere. Fast, private and temporary file sharing using QR codes, short codes, and direct browser-to-browser P2P transfer with 10-minute auto-expiry." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f1f5f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShareFlow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('shareflow_theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            // Light mode by default
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

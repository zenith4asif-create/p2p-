<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Outer subtle circuit glow -->
  <circle cx="256" cy="256" r="210" stroke="url(#glowGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
  
  <!-- Stylized Flow File & QR Nodes -->
  <!-- Top Left QR Finder -->
  <rect x="110" y="110" width="90" height="90" rx="20" stroke="url(#glowGrad)" stroke-width="12" fill="none"/>
  <rect x="135" y="135" width="40" height="40" rx="10" fill="#38bdf8"/>
  
  <!-- Bottom Left QR Finder -->
  <rect x="110" y="312" width="90" height="90" rx="20" stroke="url(#glowGrad)" stroke-width="12" fill="none"/>
  <rect x="135" y="337" width="40" height="40" rx="10" fill="#6366f1"/>
  
  <!-- Top Right QR Finder -->
  <rect x="312" y="110" width="90" height="90" rx="20" stroke="url(#glowGrad)" stroke-width="12" fill="none"/>
  <rect x="337" y="135" width="40" height="40" rx="10" fill="#a855f7"/>
  
  <!-- Center Transfer Flow Arrow / Lightning -->
  <path d="M230 210 L300 256 L230 302" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="256" r="8" fill="#38bdf8"/>
  <path d="M210 256 L280 256" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Digital Bits / Nodes in lower right -->
  <rect x="320" y="320" width="30" height="30" rx="8" fill="#38bdf8" opacity="0.9"/>
  <rect x="365" y="320" width="35" height="35" rx="8" fill="#a855f7" opacity="0.9"/>
  <rect x="320" y="365" width="35" height="35" rx="8" fill="#6366f1" opacity="0.9"/>
  <rect x="370" y="370" width="25" height="25" rx="6" fill="#38bdf8" opacity="0.7"/>
</svg>
